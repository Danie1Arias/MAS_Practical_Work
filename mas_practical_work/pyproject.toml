[project]
name = "mas_practical_work"
version = "0.1.0"
description = "mas_practical_work using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.79.4,<1.0.0"
]

[project.scripts]
mas_practical_work = "mas_practical_work.main:run"
run_crew = "mas_practical_work.main:run"
train = "mas_practical_work.main:train"
replay = "mas_practical_work.main:replay"
test = "mas_practical_work.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
